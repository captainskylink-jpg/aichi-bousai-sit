name: Check Train Status

on:
  schedule:
    # 15分おきに自動実行する設定 (Cron形式)
    - cron: '*/15 * * * *'
  workflow_dispatch: # 手動でも動かせるようにする

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Run script
        run: python check_train.py

      - name: Commit and push status.json if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add status.json
          git commit -m "Auto-update train status.json" || exit 0
          git push
