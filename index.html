<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>愛知県 交通・防災ポータル（自動監視連動）</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f8fafc; }
        .map-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .map-base { width: 100%; height: auto; display: block; }
        .map-overlay { position: absolute; top: 0; left: 0; width: 100%; height: auto; pointer-events: none; display: none; } /* 平時は非表示 */
        
        /* 異常時に付与する点滅クラス */
        .is-alert {
            display: block !important;
            animation: pulse-blink 2s infinite ease-in-out;
        }
        @keyframes pulse-blink {
            0% { opacity: 1.0; }
            50% { opacity: 0.3; }
            100% { opacity: 1.0; }
        }

        /* 異常時のアラート・リンク表示エリア */
        #alert-box {
            margin-top: 20px;
            padding: 15px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 6px;
            color: #991b1b;
            display: none; /* 平時は隠す */
        }
    </style>
</head>
<body>

    <h1>愛知県 交通・防災ポータル</h1>
    <p class="status">JR東海 在来線の運行状況を監視中（15分おき）</p>

    <!-- 異常時にのみテキストと公式リンクを表示するエリア -->
    <div id="alert-box">
        <strong>⚠️ 運行情報に乱れがあります</strong>
        <p id="alert-message"></p>
    </div>

    <div class="map-container">
        <img src="aichi_base.svg" alt="愛知県白地図" class="map-base">
        <!-- 異常時のみ「is-alert」クラスがついて赤く点滅するオーバーレイ -->
        <img src="aichi_rail1.svg" alt="愛知県鉄道路線" class="map-overlay" id="rail-overlay">
    </div>

<script>
    async function fetchTrainStatus() {
        try {
            // キャッシュを無視して最新の status.json を取得
            const response = await fetch('status.json?t=' + new Date().getTime());
            const data = await response.json();

            const railOverlay = document.getElementById('rail-overlay'); // 点滅させる鉄道路線画像
            const alertBox = document.getElementById('alert-box');       // 警告テキストを表示する枠

            if (data.zairaisen === "delay") {
                // 異常時の処理
                if (railOverlay) railOverlay.classList.add('is-alert'); // 点滅クラスを追加
                if (alertBox) {
                    alertBox.style.display = 'block';
                    alertBox.innerHTML = '⚠️ <strong>JR東海 在来線に運行情報の乱れがあります</strong><br>' +
                        '<a href="https://traininfo.jr-central.co.jp/zairaisen/index.html?lang=ja" target="_blank" style="color: #991b1b; font-weight: bold; text-decoration: underline;">👉 JR東海 公式運行情報で詳細を確認する</a>';
                }
            } else {
                // 平常時の処理
                if (railOverlay) railOverlay.classList.remove('is-alert');
                if (alertBox) alertBox.style.display = 'none';
            }
        } catch (error) {
            console.error("ステータスの取得に失敗しました", error);
        }
    }

    // ページ読み込み時に実行 ＆ 以後3分おきに自動チェック
    fetchTrainStatus();
    setInterval(fetchTrainStatus, 3 * 60 * 1000);
</script>
</body>
</html>
